# OpenRewrite recipe: migrate a project that uses the Jlama SDK to bitubi-inference-4j.
# Usage and limits: docs/migration-from-jlama.md, section "Automated migration with OpenRewrite".
# Every mapping here is listed, with its source in the repository history, in that document.
---
type: specs.openrewrite.org/v1beta/recipe
name: ao.bitubi.inference4j.MigrateFromJlama
displayName: Migrate from Jlama to bitubi-inference-4j
description: >-
  Renames the Maven coordinates, the Java packages, the classes, the system properties, the HTTP header
  and the environment variables of Jlama 0.8.x to their bitubi-inference-4j names.
recipeList:
  - ao.bitubi.inference4j.MigrateFromJlama.Dependencies
  - ao.bitubi.inference4j.MigrateFromJlama.Types
  - ao.bitubi.inference4j.MigrateFromJlama.Contracts
---
type: specs.openrewrite.org/v1beta/recipe
name: ao.bitubi.inference4j.MigrateFromJlama.Dependencies
displayName: Jlama Maven coordinates to bitubi-inference-4j
description: "com.github.tjake:jlama-* becomes ao.bitubi:bitubi-inference-4j-*. The version is left as it was, so set the release you adopt afterwards."
recipeList:
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: com.github.tjake
      oldArtifactId: jlama-core
      newGroupId: ao.bitubi
      newArtifactId: bitubi-inference-4j-core
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: com.github.tjake
      oldArtifactId: jlama-native
      newGroupId: ao.bitubi
      newArtifactId: bitubi-inference-4j-native
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: com.github.tjake
      oldArtifactId: jlama-net
      newGroupId: ao.bitubi
      newArtifactId: bitubi-inference-4j-net
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: com.github.tjake
      oldArtifactId: jlama-cli
      newGroupId: ao.bitubi
      newArtifactId: bitubi-inference-4j-cli
---
type: specs.openrewrite.org/v1beta/recipe
name: ao.bitubi.inference4j.MigrateFromJlama.Types
displayName: Jlama Java types to bitubi-inference-4j
description: Class renames first (they leave the old package), then the package rename for everything else.
recipeList:
  # Classes whose simple name changed (Jlama -> Bi4j).
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.github.tjake.jlama.cli.JlamaCli
      newFullyQualifiedTypeName: ao.bitubi.inference4j.cli.Bi4jCli
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.github.tjake.jlama.net.grpc.JlamaService
      newFullyQualifiedTypeName: ao.bitubi.inference4j.net.grpc.Bi4jService
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.github.tjake.jlama.net.grpc.JlamaRingWorkerService
      newFullyQualifiedTypeName: ao.bitubi.inference4j.net.grpc.Bi4jRingWorkerService
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.github.tjake.jlama.util.JsonSupport$JlamaPrettyPrinter
      newFullyQualifiedTypeName: ao.bitubi.inference4j.util.JsonSupport$Bi4jPrettyPrinter
  # Classes generated by protoc from JlamaService.proto (now Bi4jService.proto, package ao.bitubi.inference4j.net).
  # The outer class is renamed first, so the nested ones are matched under their new outer name.
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.github.tjake.jlama.net.JlamaServiceGrpc
      newFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jServiceGrpc
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.github.tjake.jlama.net.JlamaWorkerRingGrpc
      newFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jWorkerRingGrpc
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jServiceGrpc$JlamaServiceBlockingStub
      newFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jServiceGrpc$Bi4jServiceBlockingStub
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jServiceGrpc$JlamaServiceStub
      newFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jServiceGrpc$Bi4jServiceStub
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jServiceGrpc$JlamaServiceImplBase
      newFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jServiceGrpc$Bi4jServiceImplBase
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jWorkerRingGrpc$JlamaWorkerRingStub
      newFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jWorkerRingGrpc$Bi4jWorkerRingStub
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jWorkerRingGrpc$JlamaWorkerRingImplBase
      newFullyQualifiedTypeName: ao.bitubi.inference4j.net.Bi4jWorkerRingGrpc$Bi4jWorkerRingImplBase
  # Every other class keeps its simple name and only changes package.
  - org.openrewrite.java.ChangePackage:
      oldPackageName: com.github.tjake.jlama
      newPackageName: ao.bitubi.inference4j
      recursive: true
---
type: specs.openrewrite.org/v1beta/recipe
name: ao.bitubi.inference4j.MigrateFromJlama.Contracts
displayName: Jlama runtime contracts to bitubi-inference-4j
description: >-
  System properties (jlama.* to bi4j.*), the session header and the environment variables.
  The use_native_tensor_operations and force_panama_tensor_operations flags have no equivalent
  key: replace them by hand with bi4j.backend (see the migration guide).
recipeList:
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: jlama.debug
      newPropertyKey: bi4j.debug
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: jlama.max_batch_size
      newPropertyKey: bi4j.max_batch_size
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: jlama.ideal_b_params
      newPropertyKey: bi4j.ideal_b_params
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: jlama.use_hostname_as_workerid
      newPropertyKey: bi4j.use_hostname_as_workerid
  - org.openrewrite.yaml.ChangePropertyKey:
      oldPropertyKey: jlama.debug
      newPropertyKey: bi4j.debug
  - org.openrewrite.yaml.ChangePropertyKey:
      oldPropertyKey: jlama.max_batch_size
      newPropertyKey: bi4j.max_batch_size
  - org.openrewrite.yaml.ChangePropertyKey:
      oldPropertyKey: jlama.ideal_b_params
      newPropertyKey: bi4j.ideal_b_params
  - org.openrewrite.yaml.ChangePropertyKey:
      oldPropertyKey: jlama.use_hostname_as_workerid
      newPropertyKey: bi4j.use_hostname_as_workerid
  # Removed flags with no key-for-key equivalent: the backend is now chosen only with bi4j.backend.
  - org.openrewrite.text.FindAndReplace:
      find: -Djlama.use_native_tensor_operations=true
      replace: -Dbi4j.backend=native
      filePattern: '**/*.{sh,bat,cmd,yaml,yml,xml,properties,md,txt}'
  - org.openrewrite.text.FindAndReplace:
      find: -Djlama.force_panama_tensor_operations=true
      replace: -Dbi4j.backend=panama
      filePattern: '**/*.{sh,bat,cmd,yaml,yml,xml,properties,md,txt}'
  # -Djlama.x=... on command lines, Dockerfiles, compose and Helm files, and Java string literals.
  - org.openrewrite.text.FindAndReplace:
      find: -Djlama.
      replace: -Dbi4j.
      filePattern: '**/*.{sh,bat,cmd,yaml,yml,xml,properties,md,txt}'
  - org.openrewrite.text.FindAndReplace:
      find: JLAMA_JVM_ARGS_EXTRA
      replace: BI4J_JVM_ARGS_EXTRA
      filePattern: '**/*.{sh,bat,cmd,yaml,yml,xml,properties,md,txt,tpl}'
  - org.openrewrite.text.FindAndReplace:
      find: JLAMA_JVM_ARGS
      replace: BI4J_JVM_ARGS
      filePattern: '**/*.{sh,bat,cmd,yaml,yml,xml,properties,md,txt,tpl}'
  - org.openrewrite.text.FindAndReplace:
      find: JLAMA_PREINSTALLED_JAR
      replace: BI4J_PREINSTALLED_JAR
      filePattern: '**/*.{sh,bat,cmd,yaml,yml,xml,properties,md,txt,tpl}'
  - org.openrewrite.text.FindAndReplace:
      find: X-Jlama-Session
      replace: X-Bi4j-Session
      filePattern: '**/*.{java,js,ts,html,sh,md,yaml,yml,json}'
